<!DOCTYPE html>
<html lang="pt-BR" class="app-loading">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ads • puc minas</title>
    <script>
        (function () {
            var raiz = document.documentElement;

            try {
                var temaSalvo = localStorage.getItem("tema-puc-ads") || localStorage.getItem("tema-puc");
                var temaDoSistema = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
                    ? "light"
                    : "dark";
                raiz.setAttribute("data-theme", temaSalvo || temaDoSistema);
            } catch (erro) {}

            window.PUC_FINALIZAR_CARREGAMENTO = function () {
                if (!raiz.classList.contains("app-loading")) return;

                if (window.PUC_LOADER_FALLBACK) {
                    clearTimeout(window.PUC_LOADER_FALLBACK);
                    window.PUC_LOADER_FALLBACK = null;
                }

                var loader = document.getElementById("initial-loader");
                if (!loader) {
                    raiz.classList.remove("app-loading");
                    return;
                }

                loader.classList.add("is-complete");

                window.setTimeout(function () {
                    raiz.classList.remove("app-loading");
                    loader.classList.add("is-leaving");

                    window.setTimeout(function () {
                        if (loader.parentNode) loader.parentNode.removeChild(loader);
                    }, 220);
                }, 180);
            };

            window.PUC_LOADER_FALLBACK = window.setTimeout(function () {
                window.PUC_FINALIZAR_CARREGAMENTO();
            }, 10000);
        }());
    </script>
    <style>
        html.app-loading,
        html.app-loading body {
            overflow: hidden;
        }

        html.app-loading body > :not(#initial-loader):not(script) {
            visibility: hidden;
        }

        #initial-loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
            opacity: 1;
        }

        :root[data-theme="light"] #initial-loader {
            background: #f8fafc;
        }

        .initial-loader__line {
            width: min(200px, 44vw);
            height: 2px;
            background: #007aff;
            transform: scaleX(0);
            transform-origin: left center;
            animation: puc-loader-progress 1.8s cubic-bezier(.2, .8, .2, 1) forwards;
            transition: transform 180ms ease-out;
        }

        :root[data-theme="light"] .initial-loader__line {
            background: #0056b3;
        }

        #initial-loader.is-complete .initial-loader__line {
            animation: none;
            transform: scaleX(1);
        }

        #initial-loader.is-leaving {
            opacity: 0;
            pointer-events: none;
            transition: opacity 200ms ease;
        }

        @keyframes puc-loader-progress {
            0% { transform: scaleX(0); }
            38% { transform: scaleX(.42); }
            72% { transform: scaleX(.72); }
            100% { transform: scaleX(.9); }
        }

        @media (prefers-reduced-motion: reduce) {
            .initial-loader__line {
                animation: none;
                transform: scaleX(.75);
                transition: none;
            }

            #initial-loader.is-leaving {
                transition: none;
            }
        }
    </style>
    <link rel="stylesheet" href="style.css?v=mermaid-style-v6">
    <link rel="stylesheet" href="search-runtime.css?v=search-v3">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
</head>

<body>
    <div id="initial-loader" role="status" aria-label="Carregando conteúdo">
        <div class="initial-loader__line" aria-hidden="true"></div>
    </div>
    <nav class="sticky-nav" id="sticky-nav">

        <label class="nav-search-container" for="nav-search-input">

    </nav>

    <main>

        <section class="explorar-disciplinas" id="explorar-disciplinas" aria-labelledby="disciplinas-titulo">

        <!-- Leitor de Artigo Individual -->
        <div class="leitor-artigo escondido" id="leitor-artigo">
            <div class="artigo-layout-container">
                <!-- Table of Contents (TOC) no Lado Esquerdo -->
                <aside class="artigo-toc-sidebar" id="artigo-toc-sidebar">
                    <div class="toc-header">
                        <span class="toc-title">Neste artigo</span>
                    </div>
                    <div class="toc-filter-container" id="toc-filter-container">
                        <input type="search" id="toc-filter-input" placeholder="filtrar seções..." autocomplete="off">
                    </div>

                </aside>

                <div class="artigo-conteudo-wrapper">
                    <nav class="artigo-breadcrumbs" id="artigo-breadcrumbs"></nav>
                    <h2 id="artigo-titulo"></h2>
                    <div class="artigo-contexto" id="artigo-contexto" hidden></div>
                    <div id="artigo-corpo" class="artigo-corpo"></div>
                    <nav class="artigo-nav-cards" id="artigo-nav-rodape" aria-label="Navegação entre artigos"></nav>
                    <div class="retorno-artigo">
                        <p id="retorno-artigo-texto">quer continuar estudando?</p>
                        <button id="btn-voltar" class="btn-voltar">&larr; voltar para a matéria</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="search-runtime.js?v=search-v3"></script>
    <script>
        (function () {
            function suportaLeitorModerno() {
                try {
                    new Function("var item = { filho: { valor: 1 } }; return item?.filho?.valor;");
                    new Function("return /(?<!a)b/.test('b');");
                    return true;
                } catch (erro) {
                    return false;
                }
            }

            function carregarScript(src, tipo, aoCarregar) {
                var script = document.createElement("script");
                script.src = src;
                if (tipo) script.type = tipo;
                if (aoCarregar) script.onload = aoCarregar;
                document.body.appendChild(script);
            }

            function carregarCss(href) {
                var link = document.createElement("link");
                link.rel = "stylesheet";
                link.href = href;
                document.head.appendChild(link);
            }

            if (suportaLeitorModerno()) {
                carregarScript("https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js", null, function () {
                    carregarScript("script.js?v=search-v3-loader-v1", "module");
                });
            } else {
                document.documentElement.className += " legacy-ios12";
                carregarCss("compat-ios12.css?v=ipad-mini-v1");
                carregarScript("legacy-ios12.js?v=ipad-mini-v2");
            }
        }());
    </script>
</body>

</html>
