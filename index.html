<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>matérias da puc</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
</head>

<body>
    <nav class="sticky-nav" id="sticky-nav">
        <span class="nav-logo" id="nav-logo">matérias da puc</span>
        <div class="nav-search-container">
            <input type="text" id="nav-search-input" placeholder="pesquisar...">
        </div>
        <div class="nav-links-right">
            <button id="btn-toc-toggle" class="nav-btn-toc escondido" title="Sumário do artigo">índice</button>
            <a href="#pastas-container" class="nav-link-pastas" id="nav-link-pastas">pastas</a>
        </div>
    </nav>

    <header>
        <h1>matérias da puc</h1>
    </header>
    <main>
        <input type="text" id="main-search-input" placeholder="o que você quer pesquisar hoje? ">
        <button>Pesquisar</button>
        <div class="pastas-container" id="pastas-container">
            <!-- As pastas serão listadas aqui dinamicamente -->
        </div>
        <div class="resultados">
            <div class="cards-container">
                <!-- resultados -->
            </div>
        </div>
        <div class="leitor-artigo escondido" id="leitor-artigo">
            <div class="artigo-layout-container">
                <!-- Table of Contents (TOC) Desktop Sidebar no Lado Esquerdo -->
                <aside class="artigo-toc-sidebar" id="artigo-toc-sidebar">
                    <div class="toc-header">
                        <span class="toc-title">Neste artigo</span>
                    </div>
                    <nav class="toc-nav" id="toc-nav"></nav>
                </aside>
                <div class="artigo-conteudo-wrapper">
                    <h2 id="artigo-titulo"></h2>
                    <div id="artigo-corpo" class="artigo-corpo"></div>
                    <button id="btn-voltar" class="btn-voltar">&larr; voltar para a busca </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Drawer Mobile para Table of Contents -->
    <div class="toc-drawer-overlay escondido" id="toc-drawer-overlay"></div>
    <div class="toc-drawer escondido" id="toc-drawer">
        <div class="toc-drawer-header">
            <span>Neste artigo</span>
            <button id="btn-fechar-drawer" class="btn-fechar-drawer">&times;</button>
        </div>
        <nav class="toc-drawer-nav" id="toc-drawer-nav"></nav>
    </div>

    <!-- Botão Flutuante Mobile para abrir o Sumário -->
    <button class="fab-toc-mobile escondido" id="fab-toc-mobile" title="Abrir sumário">
        <span class="fab-icon">☰</span>
        <span class="fab-label">Sumário</span>
    </button>

    <script src="script.js"></script>
</body>

</html>
