name: Atualizar índice de busca

on:
  push:
    branches:
      - main
    paths:
      - "**/*.md"
      - "index.html"
      - "script.js"
      - "search-runtime.js"
      - "search-runtime.css"
      - "scripts/build-search-index.mjs"
      - ".github/workflows/build-search-index.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: search-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Validar JavaScript
        run: |
          node --check search-runtime.js
          node --check script.js
          node --check scripts/build-search-index.mjs

      - name: Gerar índice
        run: node scripts/build-search-index.mjs

      - name: Salvar índice atualizado
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Outro commit pode chegar à main enquanto este job está executando.
          # Nesse caso, atualiza para a ponta mais recente, regenera o índice
          # e tenta novamente em vez de falhar com non-fast-forward.
          for tentativa in 1 2 3; do
            echo "Tentativa $tentativa de 3"

            git fetch origin main
            git reset --hard origin/main

            node scripts/build-search-index.mjs
            git add search-index.json

            if git diff --cached --quiet; then
              echo "Índice já está atualizado."
              exit 0
            fi

            git commit -m "chore: atualiza índice de busca [skip ci]"

            if git push origin HEAD:main; then
              echo "Índice atualizado com sucesso."
              exit 0
            fi

            echo "A branch main avançou durante o job; regenerando a partir da versão mais recente."
            sleep $((tentativa * 2))
          done

          echo "Não foi possível atualizar o índice após 3 tentativas."
          exit 1
